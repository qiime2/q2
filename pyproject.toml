[project]
name = "qiime2"
authors = [
    { name = "QIIME 2 Developers", email = "developers@qiime2.org" } 
]
description = "QIIME 2 Proxy Package"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = ["version"]

[project.urls]
Homepage = "https://qiime2.org"
Repository = "https://github.com/qiime2/q2"

[project.scripts]
"qiime" = "qiime2.__main__:qiime"

[dependency-groups]
dev = [
    "nox>=2025.11.12",
    "pytest>=9.0.2,<10.0.0",
    "rachis",
    "ruff>=0.14.10",
]

[build-system]
requires = [
    "setuptools",
    "versioningit",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "src/qiime2/_version.py"

[tool.setuptools]
include-package-data = true
script-files = [
    "bin/tab-qiime"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qiime2 = ["**/*"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E", "F", "W"]
